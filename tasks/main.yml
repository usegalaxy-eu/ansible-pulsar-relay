---
- name: Set up storage backend (OS-specific)
  include_tasks: "backend-{{ ansible_os_family | lower }}.yml"
  when:
    - pulsar_relay_storage_backend == "valkey"
    - pulsar_relay_manage_valkey | bool

- name: Install Python3 and venv (Debian/Ubuntu)
  apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Python3 and pip (RedHat/Rocky)
  dnf:
    name:
      - python3
      - python3-pip
      - git
    state: present
  when: ansible_os_family == "RedHat"

- name: Create pulsar-relay system group
  group:
    name: "{{ pulsar_relay_user }}"
    system: true

- name: Create pulsar-relay system user
  user:
    name: "{{ pulsar_relay_user }}"
    group: "{{ pulsar_relay_user }}"
    system: true
    home: "{{ pulsar_relay_home }}"
    create_home: false
    shell: /sbin/nologin

- name: Create pulsar-relay directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pulsar_relay_user }}"
    group: "{{ pulsar_relay_user }}"
    mode: "0755"
  loop:
    - "{{ pulsar_relay_home }}"
    - "{{ pulsar_relay_venv }}"

- name: Install pulsar-relay from GitHub
  pip:
    name: "git+https://github.com/galaxyproject/pulsar-relay.git@{{ pulsar_relay_version }}"
    virtualenv: "{{ pulsar_relay_venv }}"
    virtualenv_command: python3 -m venv
  become_user: "{{ pulsar_relay_user }}"
  notify: restart pulsar-relay

- name: Deploy pulsar-relay environment file
  template:
    src: pulsar-relay.env.j2
    dest: "{{ pulsar_relay_env_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: restart pulsar-relay

- name: Deploy systemd service
  template:
    src: pulsar-relay.service.j2
    dest: "/etc/systemd/system/{{ pulsar_relay_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart pulsar-relay

- name: Enable and start pulsar-relay
  systemd:
    name: "{{ pulsar_relay_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
